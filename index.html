    <style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

    <title>食物大軍</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* 夜市配色：深紫夜空、燈籠紅、麵條黃、茶綠、閘門藍。全螢幕畫布加 DOM 疊層。 */
:root{
  --ink:#1b1226; --panel:#2b1d3a; --panel2:#3b2852; --steam:#fff3df; --muted:#bba9cc;
  --lantern:#ff5a3c; --noodle:#ffc95c; --noodle-d:#b8862a; --tea:#6fdca4; --blue:#46a8ff; --bad:#ff4d6d;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Fredoka","Huninn",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--ink);color:var(--steam);font-family:var(--display);font-size:16px;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;box-sizing:border-box;
  padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen[hidden]{display:none}
.hud{pointer-events:none}
.hud button{pointer-events:auto}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--steam);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--noodle);color:#2b1d3a;font-size:18px;
  box-shadow:0 4px 0 var(--noodle-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--noodle-d)}
.btn.big{font-size:22px;padding:14px 20px}
.btn.ghost{background:var(--panel2);color:var(--steam);box-shadow:0 4px 0 #170f21}
.btn.ghost:active{box-shadow:0 1px 0 #170f21}
.btn.small{font-size:15px;padding:8px 14px}
.icon{width:40px;height:40px;border-radius:12px;border:0;background:rgba(43,29,58,.8);color:var(--steam);font-size:20px;cursor:pointer;line-height:1}
.icon:disabled{opacity:.3}

#lvName{font-size:22px}

.devcard{background:rgba(43,29,58,.92);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.chip[aria-pressed="true"]{border-color:var(--noodle);background:rgba(255,201,92,.12);color:var(--noodle)}

<div id="stage">

  <div class="ver">v0.2.2</div>

  <section id="menu" class="screen menu">

  </section>

  <section id="tres" class="screen center" hidden>
    <div class="card wide">
      <h2>裝置測試結果</h2>

  </section>

<script>

/* ---------- 存檔 ---------- */
const SKEY = 'foodarmy.v1';
let save = { level: 1, sel: 1, stars: {}, cap: null, tier: 'rec', mute: false };

/* ---------- 食物與隊伍陣型 ---------- */
function eyes(c, x, y) { c.fillStyle = '#2b1d3a'; c.beginPath(); c.arc(x - 4, y, 1.9, 0, 7); c.arc(x + 4, y, 1.9, 0, 7); c.fill(); }
// 32×32 座標；fx/fy 是眼睛位置，my 是魔王嘴巴位置
const FOODS = [
  { name: '漢堡', col: '#e9a24a', fx: 16, fy: 12, my: 21.5, draw(c) {
    c.fillStyle = '#e9a24a'; c.beginPath(); c.arc(16, 15, 11, Math.PI, 0); c.lineTo(27, 17); c.lineTo(5, 17); c.fill();
    c.fillStyle = '#6fdca4'; c.fillRect(4, 17, 24, 3);
    c.fillStyle = '#7a4a2b'; c.fillRect(5, 20, 22, 4);
    c.fillStyle = '#e9a24a'; c.fillRect(6, 24, 20, 5);
  } },
  { name: '飯糰', col: '#fff3df', fx: 16, fy: 15, my: 20, draw(c) {
    c.fillStyle = '#fff3df'; c.beginPath(); c.moveTo(16, 3); c.quadraticCurveTo(30, 22, 27, 27); c.quadraticCurveTo(16, 31, 5, 27); c.quadraticCurveTo(2, 22, 16, 3); c.fill();
    c.fillStyle = '#2b2233'; c.fillRect(8, 22, 16, 6);
  } },
  { name: '珍珠奶茶', col: '#d9b48f', fx: 16, fy: 17, my: 22.5, draw(c) {
    c.fillStyle = '#ff8fa8'; c.fillRect(19, 1, 3, 9);
    c.fillStyle = '#d9b48f'; c.beginPath(); c.moveTo(7, 10); c.lineTo(25, 10); c.lineTo(22, 29); c.lineTo(10, 29); c.fill();
    c.fillStyle = '#fff'; c.fillRect(6, 7, 20, 3);
    c.fillStyle = '#3a2a2a'; [12, 16, 20].forEach(x => { c.beginPath(); c.arc(x, 26.5, 2, 0, 7); c.fill(); });
  } },
  { name: '荷包蛋', col: '#f4f0e4', fx: 16, fy: 17, my: 23.5, draw(c) {
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(16, 18, 13, 11, 0, 0, 7); c.fill();

  } },
  { name: '雞排', col: '#d98a2b', fx: 16, fy: 14, my: 21, draw(c) {
    c.fillStyle = '#d98a2b'; c.beginPath(); c.moveTo(5, 10); c.quadraticCurveTo(4, 4, 12, 5); c.quadraticCurveTo(20, 2, 26, 7); c.quadraticCurveTo(30, 14, 27, 24); c.quadraticCurveTo(22, 30, 12, 28); c.quadraticCurveTo(3, 26, 5, 10); c.fill();
    c.fillStyle = '#f0b050'; [[9, 9], [21, 8], [25, 17], [8, 22], [19, 26]].forEach(p => { c.beginPath(); c.arc(p[0], p[1], 1.7, 0, 7); c.fill(); });
  } },
  { name: '甜甜圈', col: '#ff8fb8', fx: 16, fy: 11, my: 23.5, draw(c) {
    c.fillStyle = '#e0a868'; c.beginPath(); c.arc(16, 17, 13, 0, 7); c.fill();
    c.fillStyle = '#ff8fb8'; c.beginPath(); c.arc(16, 16, 11, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.fillRect(8, 10, 3, 1.4); c.fillRect(21, 12, 3, 1.4); c.fillRect(11, 23, 3, 1.4); c.fillRect(22, 21, 1.4, 3);
    c.fillStyle = '#ffc95c'; c.fillRect(14, 7, 1.4, 3); c.fillRect(6, 17, 3, 1.4); c.fillRect(24, 17, 3, 1.4);
    c.globalCompositeOperation = 'destination-out'; c.beginPath(); c.arc(16, 17, 3.2, 0, 7); c.fill(); c.globalCompositeOperation = 'source-over';
  } },
  { name: '小籠包', col: '#fff6e8', fx: 16, fy: 19.5, my: 25, draw(c) {
    c.fillStyle = '#fff6e8'; c.beginPath(); c.ellipse(16, 20, 12, 9, 0, 0, 7); c.fill();
    c.strokeStyle = '#e8cfae'; c.lineWidth = 1.2; c.lineCap = 'round';
    for (let a = -3; a <= 3; a++) { c.beginPath(); c.moveTo(16, 10.5); c.lineTo(16 + a * 3.2, 14.5); c.stroke(); }
    c.fillStyle = '#f2dcc0'; c.beginPath(); c.arc(16, 10, 3.2, 0, 7); c.fill();
  } },
  { name: '薯條', col: '#e04545', fx: 16, fy: 20.5, my: 26, draw(c) {
    c.fillStyle = '#ffc95c'; [[8, 3, 4, 12], [13, 1, 4, 14], [18, 2, 4, 13], [23, 5, 3, 10]].forEach(r => c.fillRect(r[0], r[1], r[2], r[3]));
    c.fillStyle = '#e04545'; c.beginPath(); c.moveTo(6, 13); c.lineTo(26, 13); c.lineTo(23, 29); c.lineTo(9, 29); c.fill();
  } }

const foodIdxOf = n => ((n - 1) % FOODS.length + FOODS.length) % FOODS.length;   // 第 n 關的隊伍
const bossIdxOf = n => n % FOODS.length;                                            // 第 n 關的魔王 = 第 n+1 關的食物
const spr = {}, big = {};
function foodSprite(i) {
  let s = spr[i];
  if (!s) { s = document.createElement('canvas'); s.width = s.height = 48; const c = s.getContext('2d'); c.scale(1.5, 1.5); FOODS[i].draw(c); eyes(c, FOODS[i].fx, FOODS[i].fy); spr[i] = s; }
  return s;
}
function foodBig(i) {
  let s = big[i];
  if (!s) { s = document.createElement('canvas'); s.width = s.height = 192; const c = s.getContext('2d'); c.scale(6, 6); FOODS[i].draw(c); big[i] = s; }
  return s;

// 隊伍陣型：六角形格子。平常最寬只排半條跑道（看得出選哪邊）；人數多到排不下時，
// 先固定大小往兩側滿出去（最寬 CROWD_MAX），再不夠才縮小。魔王戰（boss）改成整條跑道散開。
const F = { id: 0, prof: '', ci: -1, s: S0, hwMax: CROWD_HALF, total: 0, X: null, Z: null, hwP: null, zmP: null, dl: null, dlN: -1, dlId: -1, prev: null };
const ZCEN = 1.2, CANDS = {};
function candList(prof) {
  if (CANDS[prof]) return CANDS[prof];
  const hws = prof === 'boss' ? [0.93] : [0.5, 0.55, 0.6, 0.65, 0.7, CROWD_MAX], L = [];
  let lastCols = 0;
  for (const hw of hws) { const cols = Math.max(2, Math.floor(2 * hw / S0)); if (cols !== lastCols) { L.push({ s: S0, hw }); lastCols = cols; } }
  const hwEnd = hws[hws.length - 1];
  for (let k = 1; k <= 300; k++) L.push({ s: S0 * Math.pow(0.93, k), hw: hwEnd });

function levelFor(N, prof) { const L = candList(prof); let i = 0; while (i < L.length - 1 && L[i].cap < N) i++; return i; }
function buildFormation(prof, ci) {

    const a = Math.abs(X[j]) + s * 0.5; if (a > hw) hw = a; if (Z[j] > zm) zm = Z[j];

}
function ensureFormation(N, prof) {
  prof = prof || 'run';

    if (prof === 'boss' && F.prof === 'run' && F.X) F.prev = { X: F.X, Z: F.Z, s: F.s, hw: Math.min(F.hwP[Math.min(N, F.total) - 1], F.hwMax + 0.05) };

// 由遠到近的繪製順序（只建一次，人數變多時才重建）
function prepDraw(NM) {
  const n = Math.min(NM, F.total);

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function applyOp(op, c, lim) {
  let r = c;

}
const opLabel = op => op.op === 'add' ? '+' + fmt(op.v) : op.op === 'mul' ? '×' + op.v : op.op === 'sub' ? '−' + fmt(op.v) : '÷' + op.v;

// 依裝置人數上限 lim 產生關卡：閘門數值與魔王血量都按上限縮放。
function genLevel(n, lim) {
  const rng = mulberry32(n * 7919 + 101);
  const rows = Math.min(9 + n, 22);                 // 第 1 關 10 道閘門，之後每關多 1 道，最多 22 道
  const start = 10;
  const target = Math.min(lim * 0.85, 250 * Math.pow(1.5, n - 1));
  const gates = [], traps = [];
  let z = 16, c = start, opt = start;
  for (let r = 0; r < rows; r++) {
    const g = Math.max(1.08, Math.pow(Math.max(target / Math.max(c, 1), 1.2), 1 / (rows - r)));
    let good;
    if (g >= 2.6) good = { op: 'mul', v: 3 };
    else if (g >= 1.7 && rng() < 0.5) good = { op: 'mul', v: 2 };
    else if (c < 80 && g >= 1.2 && rng() < 0.18) good = { op: 'mul', v: 2 };
    else good = { op: 'add', v: niceInt(Math.max(2, c * (g - 1))) };
    let bad; const k = rng();
    if (k < 0.4) bad = { op: 'sub', v: Math.max(1, niceInt(c * (0.25 + rng() * 0.25))) };
    else if (k < 0.65) bad = { op: 'div', v: 2 };
    else bad = { op: 'add', v: Math.max(1, niceInt(c * (g - 1) * 0.3)) };
    const goodLeft = rng() < 0.5;
    const gate = { z, L: goodLeft ? good : bad, R: goodLeft ? bad : good, used: false, picked: null };
    gates.push(gate);
    c = applyOp(good, c, lim);
    opt = Math.max(applyOp(gate.L, opt, lim), applyOp(gate.R, opt, lim));
    if (n >= 2 && r < rows - 1 && rng() < Math.min(0.3 + 0.05 * n, 0.85)) {
      traps.push({ z: z + 6, x: [-0.5, 0, 0.5][Math.floor(rng() * 3)], used: false });
    }
    z += 12;
  }
  const bossZ = z + 12;
  const frac = 0.45 + 0.25 * Math.min(1, (n - 1) / 12);
  const hp = Math.max(3, Math.round(opt * frac));
  return { n, gates, traps, bossZ, hp, opt, start, lim, food: foodIdxOf(n), bossFood: bossIdxOf(n) };
}

function floater(x, y, text, col, size) { G.floaters.push({ x, y, text, col, size: size || 30, t: 0, life: 0.9 }); }
const DIGIT_EN = ['ZERO', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE'];
// 人數向上跨過 67、167、267… 時觸發
function sixCheck(before, after) {

}
function triggerSix(t) {

function finalizeStage() {
  if (!T || T.done) return;
  let fps, ms;
  if (T.frames >= 1) { ms = T.sum / T.frames; fps = 1000 / ms; } else { ms = lastDt; fps = 1000 / Math.max(1, lastDt); }

  if (fps < 22 || G.count >= MAXN) endTest();
}
function applyPart(op, n, lim) {

  if (mode === 'test') {

/* ---------- 裝置測試結果 ---------- */
function computeVerdict(rec) {
  let base = 0; for (const r of rec) if (r.n <= 64) base = Math.max(base, r.fps);
  base = clamp(Math.round(base || 60), 24, 165);
  const smoothTh = Math.min(55, base * 0.9), okTh = Math.min(30, base * 0.5);
  const find = th => {
    let last = -1;
    for (let i = 0; i < rec.length; i++) {
      if (rec[i].fps >= th) { last = i; continue; }
      if (last < 0) return { n: 8, hit: true };
      const a = rec[last], b = rec[i];
      const f = clamp((a.fps - th) / Math.max(0.01, a.fps - b.fps), 0, 1);
      return { n: a.n * Math.pow(2, f), hit: true };
    }
    return { n: rec[rec.length - 1].n, hit: false };
  };
  const s = find(smoothTh), o = find(okTh);
  const recCap = niceFloor(Math.max(16, s.n));
  return { base, smoothTh, okTh, rec: recCap, max: Math.max(recCap, niceFloor(Math.max(16, o.n))), safe: Math.max(16, niceFloor(recCap * 0.5)), atLeast: !s.hit };
}
let verdict = null, selTier = 'rec';
function endTest() {

  verdict = computeVerdict(T.rec); selTier = 'rec';
  const v = verdict;
  $('tresLead').textContent = (v.atLeast ? '這台裝置跑到測試上限 ' + fmt(MAXN) + ' 隻都還流暢。' : '這台裝置約在 ' + fmt(v.rec) + ' 隻以內都能保持流暢。') + '（基準 ' + v.base + ' FPS）';
  $('tresNote').textContent = '關卡的閘門數值與魔王血量，會依你選的上限自動縮放。';
  buildChips($('tresChips'), v, selTier, t => { selTier = t; buildChips($('tresChips'), v, selTier, null); });
  G.count = 36; G.speed = 3; resetWorld(); show('tres');
  requestAnimationFrame(() => drawChart(T.rec, v));
}
function buildChips(box, v, sel, onPick) {
  box.textContent = '';
  [['safe', '保守'], ['rec', '建議'], ['max', '極限']].forEach(([k, name]) => {
    const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', String(sel === k));
    const s = document.createElement('span'); s.textContent = name; const n = document.createElement('b'); n.textContent = fmt(v[k]);
    b.append(s, n); b.addEventListener('click', () => { if (onPick) onPick(k); }); box.append(b);

function drawChart(rec, v) {
  const c = $('chart'), w = c.clientWidth || 320, h = 150;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  const padL = 28, padB = 22, padT = 8, pw = w - padL - 6, ph = h - padB - padT;
  const yMax = Math.max(60, v.base + 8);
  x.font = '500 10px Fredoka, sans-serif'; x.textAlign = 'right'; x.textBaseline = 'middle'; x.fillStyle = COL.muted;
  [0, 30, 60].filter(t => t <= yMax).forEach(t => { const y = padT + ph - t / yMax * ph; x.fillText(String(t), padL - 5, y); x.strokeStyle = 'rgba(187,169,204,.18)'; x.beginPath(); x.moveTo(padL, y); x.lineTo(w - 6, y); x.stroke(); });

    }

    const y = padT + ph - th / yMax * ph; x.strokeStyle = col; x.setLineDash([4, 4]); x.beginPath(); x.moveTo(padL, y); x.lineTo(w - 6, y); x.stroke(); x.setLineDash([]);
  });
}

cv.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x; drag.x = e.clientX;
  if (mode === 'play' || mode === 'test') G.tx = clamp(G.tx + dx / laneHalf * 1.15, -LIM_X, LIM_X);
});
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { drag = null; }));
window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true; });
window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false; });

/* ---------- 更新 ---------- */
function update(dt) {
  G.t += dt;
  if (G.flash > 0) G.flash -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.six) { G.six.t += dt; if (G.six.t >= G.six.dur) G.six = null; }
  for (let i = G.parts.length - 1; i >= 0; i--) { const q = G.parts[i]; q.t += dt; q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt; if (q.t >= q.life) G.parts.splice(i, 1); }
  for (let i = G.floaters.length - 1; i >= 0; i--) { const f = G.floaters[i]; f.t += dt; f.y -= 46 * dt; if (f.t >= f.life) G.floaters.splice(i, 1); }

  if (mode === 'menu' || mode === 'testdone') {
    G.D += 3 * dt; G.leaderX = Math.sin(G.t * 0.7) * 0.45; return;
  }
  if (mode === 'play' || mode === 'test') {
    if (keys.l) G.tx = Math.max(-LIM_X, G.tx - 1.9 * dt);
    if (keys.r) G.tx = Math.min(LIM_X, G.tx + 1.9 * dt);
    G.leaderX += (G.tx - G.leaderX) * Math.min(1, dt * 14);
    G.D += G.speed * dt;
    for (const g of G.gates) if (!g.used && g.z - G.D <= ZC) { resolveGate(g); if (mode !== 'test' && mode !== 'play') return; if (T && T.done) return; }
    if (mode === 'play') {
      for (const t of G.traps) if (!t.used && t.z - G.D <= ZC) resolveTrap(t);
      $('hudProg').style.width = (clamp(G.D / G.stopD, 0, 1) * 100).toFixed(1) + '%';
      if (G.D >= G.stopD) { G.D = G.stopD; startBoss(); }
    }
  } else if (mode === 'boss') {
    G.leaderX += (0 - G.leaderX) * Math.min(1, dt * 5);
    updateBoss(dt);
  }
  if (mode === 'play' || mode === 'boss' || mode === 'result') {
    if (G.count !== G.shownCount) { $('hudCount').textContent = fmt(G.count); G.shownCount = G.count; }
  }
}

/* ---------- 繪圖 ---------- */
function proj(wx, z) { const p = 1 / (1 + PK * z); return [W / 2 + wx * laneHalf * p, horizonY + (groundY - horizonY) * p, p]; }

function drawBG() {
  ctx.fillStyle = skyG; ctx.fillRect(0, 0, W, horizonY + 2);
  ctx.fillStyle = 'rgba(255,233,176,.9)'; ctx.beginPath(); ctx.arc(W * 0.8, horizonY * 0.5, 13, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,233,176,.12)'; ctx.beginPath(); ctx.arc(W * 0.8, horizonY * 0.5, 30, 0, 7); ctx.fill();
  ctx.fillStyle = '#1d1230'; let sx = 0;
  for (const b of skyline) { const bw = b.w * W; ctx.fillRect(sx, horizonY - b.h, bw, b.h + 2); sx += bw + 2; if (sx > W) break; }
  ctx.fillStyle = groundG; ctx.fillRect(0, horizonY, W, H - horizonY);
  const zf = 60, zn = -1.4, a = proj(-1, zf), b = proj(1, zf), c = proj(1, zn), d = proj(-1, zn);
  ctx.fillStyle = trackG; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for (let zz = -(G.D % 6); zz < FAR + 6; zz += 6) {
    const z1 = Math.max(zz, zn), z2 = zz + 3; if (z2 <= zn) continue;
    const p1 = proj(-1, z1), p2 = proj(1, z1), p3 = proj(1, z2), p4 = proj(-1, z2);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.lineTo(p4[0], p4[1]); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,201,92,.85)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(d[0], d[1]); ctx.moveTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.stroke();
  const first = Math.ceil((G.D - 1.2) / 5) * 5;
  for (let kz = first + Math.ceil(FAR / 5) * 5; kz >= first; kz -= 5) {
    const rel = kz - G.D; if (rel < -1.2 || rel > FAR) continue;
    for (const sd of [-1, 1]) {
      const q = proj(sd * 1.3, rel), h = 1.05 * laneHalf * q[2], r = 0.17 * laneHalf * q[2];
      ctx.strokeStyle = '#120a1c'; ctx.lineWidth = Math.max(1, 3 * q[2]); ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[0], q[1] - h); ctx.stroke();
      ctx.fillStyle = 'rgba(255,201,92,.22)'; ctx.beginPath(); ctx.arc(q[0], q[1] - h, r * 1.9, 0, 7); ctx.fill();
      ctx.fillStyle = COL.lantern; ctx.beginPath(); ctx.arc(q[0], q[1] - h, r, 0, 7); ctx.fill();
      ctx.fillStyle = COL.noodle; ctx.fillRect(q[0] - r * 0.5, q[1] - h - r * 1.05, r, Math.max(1, r * 0.2));
    }
  }
}

function drawGate(g) {
  const rel = g.z - G.D; if (rel > FAR || rel < -1.4) return;
  const p = 1 / (1 + PK * rel), y0 = horizonY + (groundY - horizonY) * p, hh = 1.35 * laneHalf * p;
  const used = g.used, pickSide = G.leaderX < 0 ? 'L' : 'R';
  for (const side of ['L', 'R']) {
    const op = g[side], good = opGood(op);
    const x0 = W / 2 + (side === 'L' ? -1 : 0.02) * laneHalf * p, x1 = W / 2 + (side === 'L' ? -0.02 : 1) * laneHalf * p;
    ctx.globalAlpha = used ? (g.picked === side ? 0.35 : 0.15) : 1;
    ctx.fillStyle = good ? 'rgba(70,168,255,.6)' : 'rgba(255,77,109,.6)'; ctx.fillRect(x0, y0 - hh, x1 - x0, hh);
    ctx.fillStyle = good ? '#9fd4ff' : '#ffb0bf'; ctx.fillRect(x0, y0 - hh, x1 - x0, Math.max(2, hh * 0.08));
    const fs = clamp(hh * 0.46, 8, 90);
    ctx.font = '700 ' + fs + 'px Fredoka, Huninn, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, fs * 0.16); ctx.strokeStyle = '#2b1d3a'; ctx.lineJoin = 'round';
    const lab = opLabel(op), tx = (x0 + x1) / 2, ty = y0 - hh * 0.5;
    ctx.strokeText(lab, tx, ty); ctx.fillStyle = COL.steam; ctx.fillText(lab, tx, ty);
    if (!used && selGate === g && curBox && (side === 'L' ? curBox.cx - curBox.hw < 0 : curBox.cx + curBox.hw > 0)) {      // 目前手指指向的那一邊
      ctx.globalAlpha = 1; ctx.lineWidth = Math.max(2, hh * 0.035); ctx.strokeStyle = '#fff'; ctx.strokeRect(x0 + 1, y0 - hh + 1, x1 - x0 - 2, hh - 2);
    }
  }
  ctx.globalAlpha = used ? 0.3 : 1; ctx.fillStyle = '#fff3df';
  ctx.fillRect(W / 2 - Math.max(1, 0.03 * laneHalf * p), y0 - hh, Math.max(2, 0.06 * laneHalf * p), hh);
  ctx.globalAlpha = 1;
}
function drawTrap(t) {
  const rel = t.z - G.D; if (rel > FAR || rel < -1.4) return;
  const q = proj(t.x, rel), rx = 0.3 * laneHalf * q[2], ry = 0.13 * laneHalf * q[2];
  ctx.globalAlpha = t.used ? 0.3 : 1;
  ctx.fillStyle = '#3a0f1a'; ctx.beginPath(); ctx.ellipse(q[0], q[1], rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = COL.lantern; ctx.beginPath(); ctx.ellipse(q[0], q[1] - ry * 0.25, rx * 0.86, ry * 0.8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = COL.noodle; ctx.beginPath(); ctx.ellipse(q[0], q[1] - ry * 0.3, rx * 0.5, ry * 0.45, 0, 0, 7); ctx.fill();
  const fl = Math.sin(G.t * 12 + t.z) * 0.12 + 0.88;
  for (let i = -1; i <= 1; i++) {
    ctx.fillStyle = i === 0 ? COL.noodle : COL.lantern; ctx.beginPath();
    ctx.moveTo(q[0] + i * rx * 0.45 - rx * 0.16, q[1] - ry * 0.6); ctx.lineTo(q[0] + i * rx * 0.45, q[1] - ry * 0.6 - laneHalf * q[2] * 0.3 * fl * (i === 0 ? 1.2 : 0.9)); ctx.lineTo(q[0] + i * rx * 0.45 + rx * 0.16, q[1] - ry * 0.6); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
// 魔王 = 下一關的食物放大版，加上憤怒的臉
function drawBoss() {
  const L = G.level; if (!L) return;
  const B = G.boss, rel = Math.max(11, G.bossZ - G.D); if (rel > FAR) return;
  const p = 1 / (1 + PK * rel), y0 = horizonY + (groundY - horizonY) * p;
  let k = 1, alpha = 1;
  if (B) { k = 0.6 + 0.4 * (B.hp / B.hp0); if (B.hp <= 0) alpha = 0.35; }
  const R = 1.6 * laneHalf * p * k, shake = B && !B.done ? Math.sin(G.t * 55) * 3 * p : 0;
  const cx = W / 2 + shake, top = y0 - 2 * R * 0.98, fd = FOODS[L.bossFood], u = 2 * R / 32;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(cx, y0, R * 1.05, R * 0.22, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = alpha;
  ctx.drawImage(foodBig(L.bossFood), cx - R, top, 2 * R, 2 * R);
  ctx.save(); ctx.translate(cx - R, top); ctx.scale(u, u);
  const fx = fd.fx, fy = fd.fy, my = fd.my;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(fx - 4.5, fy, 3.4, 0, 7); ctx.arc(fx + 4.5, fy, 3.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b1d3a'; ctx.beginPath(); ctx.arc(fx - 4, fy + 0.4, 1.7, 0, 7); ctx.arc(fx + 4, fy + 0.4, 1.7, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2b1d3a'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(fx - 8, fy - 4.8); ctx.lineTo(fx - 2, fy - 2.4); ctx.moveTo(fx + 8, fy - 4.8); ctx.lineTo(fx + 2, fy - 2.4); ctx.stroke();
  const mo = B && !B.done ? 0.9 * Math.abs(Math.sin(G.t * 14)) : 0.3, mh = 2.2 + mo;
  ctx.fillStyle = '#4a0f22'; ctx.beginPath(); ctx.ellipse(fx, my, 5, mh, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(fx + i * 1.8 - 0.7, my - mh + 0.3); ctx.lineTo(fx + i * 1.8, my - mh + 1.9); ctx.lineTo(fx + i * 1.8 + 0.7, my - mh + 0.3); ctx.fill(); }
  ctx.restore();
  ctx.globalAlpha = 1;
  const bw = 1.7 * laneHalf * p, bh = Math.max(8, 14 * Math.min(1.4, p * 2)), bx = W / 2 - bw / 2, by = Math.max(112, top - bh - 6);
  const hpNow = B ? B.hp : L.hp, hp0 = B ? B.hp0 : L.hp;
  ctx.fillStyle = 'rgba(27,18,38,.9)'; ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
  ctx.fillStyle = COL.bad; ctx.fillRect(bx, by, bw * clamp(hpNow / hp0, 0, 1), bh);
  ctx.font = '700 ' + Math.max(11, bh) + 'px Fredoka, Huninn, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = COL.steam; ctx.fillText('巨大' + fd.name + ' ' + fmt(hpNow), W / 2, by + bh / 2 + 1);
}

function drawCrowd() {
  const N = G.count | 0; if (N <= 0) return;
  const boss = !!G.boss && (mode === 'boss' || mode === 'result'), prof = boss ? 'boss' : 'run';
  const NM = (mode === 'boss' && G.boss) ? Math.max(N, G.boss.c0) : N;
  ensureFormation(NM, prof); prepDraw(NM);
  const sp0 = (mode === 'boss' && G.boss) ? clamp(G.boss.spreadT, 0, 1) : 1, sp = sp0 * sp0 * (3 - 2 * sp0);
  const pv = (sp < 1 && F.prev) ? F.prev : null;      // 魔王戰一開始：由半寬散開成整條跑道
  const idxN = Math.min(N, F.total) - 1;
  let hw = Math.min(F.hwP[idxN], F.hwMax + 0.05), s = F.s;
  if (pv) { hw = pv.hw + (hw - pv.hw) * sp; s = pv.s + (s - pv.s) * sp; }
  const zm = F.zmP[idxN], lim = Math.max(0, LANE_IN - hw), cxw = clamp(G.leaderX, -lim, lim);
  const dyH = groundY - horizonY, px0 = s * laneHalf, food = FOODS[G.foodIdx];
  const pN = 1 / (1 + PK * ZC), pF = 1 / (1 + PK * (ZC + zm + s)), pM = (pN + pF) / 2;
  const yN = horizonY + dyH * pN, yF = horizonY + dyH * pF;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath();
  ctx.ellipse(W / 2 + cxw * laneHalf * pM, (yN + yF) / 2, (hw + 0.06) * laneHalf * pM, (yN - yF) / 2 + 4, 0, 0, 7); ctx.fill();
  const dl = F.dl, X = F.X, Z = F.Z, nd = dl.length, cw = W / 2;
  const big = px0 * pN >= 6, img = big ? foodSprite(G.foodIdx) : null, hop = big && N <= 600, t9 = G.t * 9;
  if (!big) ctx.fillStyle = food.col;
  for (let j = 0; j < nd; j++) {
    const i = dl[j]; if (i >= N) continue;
    let x = X[i], z = Z[i];
    if (pv) { x = pv.X[i] + (x - pv.X[i]) * sp; z = pv.Z[i] + (z - pv.Z[i]) * sp; }
    const p = 1 / (1 + PK * (ZC + z)), px = px0 * p * 1.14, sx = cw + (cxw + x) * laneHalf * p - px * 0.5;
    let y = horizonY + dyH * p;
    if (big) {
      if (hop) y -= Math.abs(Math.sin(t9 + i * 0.9)) * 0.05 * laneHalf * p;
      ctx.drawImage(img, sx, y - px, px, px);
    } else {
      const q = Math.max(1.3, px);
      ctx.fillRect(sx, y - q, q, q);
    }
  }
}
function drawFloaters() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of G.floaters) {
    const a = 1 - Math.pow(f.t / f.life, 2), s = f.size * (1 + Math.max(0, 0.3 - f.t) * 1.2);
    ctx.globalAlpha = clamp(a, 0, 1); ctx.font = '700 ' + s + 'px Fredoka, Huninn, sans-serif';
    ctx.lineWidth = s * 0.16; ctx.strokeStyle = '#2b1d3a'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function drawParts() {
  if (!G.parts.length) return;
  const img = foodSprite(G.foodIdx);
  for (const q of G.parts) {
    ctx.globalAlpha = clamp(1 - q.t / q.life, 0, 1);
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.drawImage(img, -q.sz / 2, -q.sz / 2, q.sz, q.sz); ctx.restore();
  }
  ctx.globalAlpha = 1;
}
// 67 特效：數字像「六七」手勢一樣上下交錯跳動
function drawSix() {
  const S = G.six; if (!S) return;
  const f = S.t / S.dur, a = f < 0.75 ? 1 : 1 - (f - 0.75) / 0.25, d = S.text.length;
  const fs = clamp(W * 0.9 / (d * 0.66), 60, 170), cols = [COL.noodle, COL.blue, COL.lantern, COL.tea];
  const pop = 1 + Math.max(0, 0.25 - S.t) * 3.2, cy = H * 0.4;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (let i = 0; i < d; i++) {
    const x = W / 2 + (i - (d - 1) / 2) * fs * 0.66, y = cy + (REDUCE ? 0 : Math.sin(S.t * 16 + i * Math.PI) * fs * 0.2);
    ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop); ctx.rotate(REDUCE ? 0 : Math.sin(S.t * 16 + i * Math.PI) * 0.12);
    ctx.font = '700 ' + fs + 'px Fredoka, Huninn, sans-serif'; ctx.lineWidth = fs * 0.13; ctx.strokeStyle = '#2b1d3a'; ctx.strokeText(S.text[i], 0, 0);
    ctx.fillStyle = cols[i % cols.length]; ctx.fillText(S.text[i], 0, 0); ctx.restore();
  }
  const ws = clamp(W * 0.055, 16, 26);
  ctx.font = '700 ' + ws + 'px Fredoka, Huninn, sans-serif'; ctx.lineWidth = ws * 0.2; ctx.strokeStyle = '#2b1d3a';
  ctx.strokeText(S.words + '!', W / 2, cy + fs * 0.7); ctx.fillStyle = COL.steam; ctx.fillText(S.words + '!', W / 2, cy + fs * 0.7);
  ctx.restore();
}
function render() {
  const sh = G.shake > 0 && !REDUCE && mode !== 'test';
  if (sh) { ctx.save(); const m = G.shake * 18; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  drawBG();
  selGate = (mode === 'play' || mode === 'test') ? (G.gates.find(g => !g.used) || null) : null;
  curBox = selGate ? crowdBox() : null;
  for (let i = G.gates.length - 1; i >= 0; i--) drawGate(G.gates[i]);
  for (let i = G.traps.length - 1; i >= 0; i--) drawTrap(G.traps[i]);
  if (G.level) drawBoss();
  drawCrowd();
  if (G.flash > 0) { ctx.globalAlpha = clamp(G.flash * 1.1, 0, 0.25); ctx.fillStyle = G.flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawFloaters(); drawParts(); drawSix();
  if (sh) ctx.restore();
}

/* ---------- 主迴圈 ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dtMs = now - last; last = now;
  if (dtMs > 1000 || dtMs <= 0) dtMs = 16;       // 分頁切換回來，忽略這一幀
  lastDt = dtMs;
  if (mode === 'test' && T && !T.done) {
    if (!T.settled && now - T.t0 >= 350) T.settled = true;
    if (T.settled) { T.frames++; T.sum += dtMs; if (dtMs > T.worst) T.worst = dtMs; }
    fpsEma = fpsEma * 0.9 + (1000 / dtMs) * 0.1;
    if (now - fpsShowAt > 200) {
      fpsShowAt = now; const f = Math.round(fpsEma); $('tFps').textContent = String(f);
      $('tFpsBox').className = 'fpsbox ' + (f >= 50 ? 'good' : f >= 30 ? 'mid' : 'low');
    }
  }
  update(Math.min(dtMs / 1000, mode === 'test' ? 0.1 : 0.05));
  if (mode === 'test' && T && !T.done && T.settled && T.frames >= 5 && T.sum / T.frames > 120) { finalizeStage(); endTest(); }
  render();
}

/* ---------- 啟動 ---------- */
resize();
try { if (document.fonts && document.fonts.load) { document.fonts.load('700 20px Fredoka'); document.fonts.load('20px Huninn'); } } catch (e) {}
goMenu();
requestAnimationFrame(frame);
})();
</script>
